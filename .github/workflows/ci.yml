name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - name: pytest (real-data tests are deselected; they need downloaded data)
        run: pytest -q --cov=quantagent --cov-report=xml --cov-report=term --cov-fail-under=90
      - name: coverage badge
        if: matrix.python == '3.12'
        run: |
          pct=$(python scripts/coverage_badge.py coverage.xml badges/coverage.svg)
          echo "Line coverage: $pct" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: badges
          path: badges/

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: evaluation on the synthetic test fixture (direct mode, must be 100%)
        run: quantagent eval --fixture --out-dir eval-out
      - run: cat eval-out/eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-out/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test stage (ruff, pytest, eval on Linux / Python 3.12)
        run: docker build --target test -t quantagent-test .
      - run: docker build -t quantagent .
      - name: runtime image starts and lists its commands
        run: docker run --rm quantagent --help

  publish-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, eval, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: badges
          path: badges
      - name: push coverage.svg to the badges branch
        run: |
          cd badges
          git init -q -b badges
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" badges
