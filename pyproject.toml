[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent"
version = "2.0.0"
description = "Read-only MCP server, agent and volatility model over real AMFI mutual-fund data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["arch>=7.0"]  # GARCH baseline, training only
agent = ["anthropic>=0.40"]
dev = ["quantagent[ml,agent]", "pytest>=8", "pytest-cov>=5", "anyio>=4", "ruff>=0.5"]

[project.scripts]
quantagent = "quantagent.cli:main"
quantagent-server = "quantagent.server:main"
quantagent-ask = "quantagent.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantagent = ["resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["realdata: needs downloaded real data and the built database (skipped in CI)"]
addopts = "-m 'not realdata'"
filterwarnings = ["error::RuntimeWarning", "error::FutureWarning"]

[tool.coverage.run]
source = ["quantagent"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S608"]
ignore = ["E501"]
